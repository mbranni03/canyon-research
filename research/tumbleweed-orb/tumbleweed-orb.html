<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tumbleweed Orb</title>
<style>
  :root {
    --bg: #faf6ef;
    --bubble: #ffffff;
    --text: #3b3127;
    --muted: #8a7b6a;
    --weed: #a9793f;
    --weed-dark: #7a5428;
    --dust: #d9c4a3;
    --ground: #e3d5bf;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1814; --bubble: #26211b; --text: #eee3d3; --muted: #a8977f;
      --weed: #d4a464; --weed-dark: #a67a3f; --dust: #5e4e3a; --ground: #3a3128;
    }
  }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: var(--bg); color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, sans-serif;
  }

  /* ---- chat bubble demo ---- */
  .msg { display: flex; gap: 12px; align-items: flex-start; max-width: 520px; padding: 0 16px; }
  .avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--weed); flex: none; }
  .bubble {
    background: var(--bubble); border-radius: 4px 16px 16px 16px; padding: 12px 16px;
    display: flex; align-items: center; gap: 10px; color: var(--muted);
    box-shadow: 0 1px 3px rgb(0 0 0 / .08);
  }

  /* ---- the orb: set font-size to scale it (1em = 1 orb width) ---- */
  .tumbleweed {
    --t: 0.9s;                         /* hop period; spin & dust key off it */
    position: relative; width: 1em; height: 1.15em; font-size: 32px; flex: none;
  }
  .tumbleweed .hop {
    position: absolute; left: 0; bottom: .12em; width: 1em; height: 1em;
    animation: tw-hop var(--t) cubic-bezier(.33, 0, .67, 1) infinite;
  }
  .tumbleweed svg {
    width: 100%; height: 100%; overflow: visible;
    animation: tw-spin calc(var(--t) * 2) linear infinite;
  }
  .tumbleweed .shadow {
    position: absolute; left: .15em; bottom: .04em; width: .7em; height: .1em;
    border-radius: 50%; background: var(--ground);
    animation: tw-shadow var(--t) cubic-bezier(.33, 0, .67, 1) infinite;
  }
  .tumbleweed .dust {
    position: absolute; bottom: .06em; left: .1em; width: .16em; height: .16em;
    border-radius: 50%; background: var(--dust); opacity: 0;
    animation: tw-dust var(--t) ease-out infinite;
  }
  .tumbleweed .dust:nth-of-type(2) { animation-delay: calc(var(--t) * -.08); width: .11em; height: .11em; bottom: .14em; }

  @keyframes tw-spin { to { transform: rotate(360deg); } }
  /* hop up, land with a squash; transform-origin at the bottom so it squashes onto the ground */
  @keyframes tw-hop {
    0%   { transform: translateY(0) scale(1.12, .86); transform-origin: 50% 100%; }
    12%  { transform: translateY(-.08em) scale(.94, 1.06); }
    50%  { transform: translateY(-.32em) scale(1); }
    88%  { transform: translateY(-.04em) scale(.97, 1.03); }
    100% { transform: translateY(0) scale(1.12, .86); transform-origin: 50% 100%; }
  }
  @keyframes tw-shadow {
    0%, 100% { transform: scaleX(1); opacity: .9; }
    50%      { transform: scaleX(.55); opacity: .45; }
  }
  /* puff kicks out behind (left) on each landing */
  @keyframes tw-dust {
    0%   { opacity: .9; transform: translate(0, 0) scale(.6); }
    100% { opacity: 0;  transform: translate(-.55em, -.2em) scale(1.6); }
  }

  @media (prefers-reduced-motion: reduce) {
    .tumbleweed .hop, .tumbleweed .shadow, .tumbleweed .dust { animation: none; }
    .tumbleweed svg { animation-duration: 6s; }
  }
</style>
</head>
<body>

<div class="msg">
  <div class="avatar" aria-hidden="true"></div>
  <div class="bubble" role="status" aria-live="polite">
    <span class="tumbleweed" aria-hidden="true">
      <span class="shadow"></span>
      <span class="dust"></span><span class="dust"></span>
      <span class="hop">
        <svg viewBox="-50 -50 100 100" fill="none" stroke-linecap="round">
          <g stroke="var(--weed-dark)" stroke-width="3.5">
            <ellipse rx="44" ry="40"/>
            <ellipse rx="40" ry="22" transform="rotate(35)"/>
            <ellipse rx="38" ry="20" transform="rotate(-50)"/>
            <ellipse rx="30" ry="34" transform="rotate(80)"/>
          </g>
          <g stroke="var(--weed)" stroke-width="3">
            <path d="M-38 -10 C-10 -40 20 -30 34 -8 S10 36 -20 28 -30 -2 -6 -6"/>
            <path d="M-20 -36 C10 -20 30 10 12 38"/>
            <path d="M36 18 C10 6 -14 22 -34 14"/>
            <path d="M-8 40 C-24 10 -2 -18 22 -34"/>
            <path d="M-28 30 C-6 18 6 -2 4 -24 S-18 -30 -26 -14"/>
            <ellipse rx="16" ry="12" transform="rotate(20)"/>
          </g>
          <!-- stray twigs poking out -->
          <g stroke="var(--weed-dark)" stroke-width="2.5">
            <path d="M40 -22 L50 -28"/><path d="M-44 8 L-52 12"/>
            <path d="M14 42 L18 51"/><path d="M-22 -40 L-27 -48"/>
          </g>
        </svg>
      </span>
    </span>
    <span>Thinking…</span>
  </div>
</div>

</body>
</html>
