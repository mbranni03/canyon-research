<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Canyon Sunrise</title>
<style>
  body { margin: 0; font-family: system-ui, sans-serif; background: #f4efe8; }

  /* Boot overlay: plays the sunrise once, holds on the name, leaves on bootLoader.dismiss() */
  #boot { position: fixed; inset: 0; z-index: 9999; background: linear-gradient(#0b2a4a, #f2a65a 75%); overflow: hidden; }
  #boot svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  #boot svg * { transform-box: fill-box; }
  #boot .title { position: absolute; top: 26%; width: 100%; margin: 0; text-align: center; color: #fff;
    font-size: clamp(2rem, 7vw, 4.5rem); font-weight: 700; letter-spacing: .15em; }

  /* intro */
  #boot .sun   { animation: sun-rise 1.8s ease-out both; }
  #boot .ridge { animation: ridge-rise 1.2s cubic-bezier(.2,.8,.3,1) both; }
  #boot .r2 { animation-delay: .15s; } #boot .r3 { animation-delay: .3s; }
  #boot .title { animation: title-in .8s ease-out .9s both; }
  @keyframes sun-rise   { from { transform: translateY(70px); } }
  @keyframes ridge-rise { from { transform: translateY(50px); } }
  @keyframes title-in   { from { opacity: 0; transform: translateY(12px); } }

  /* exit: name lifts away, ridges sink, sun sets, then the overlay fades */
  #boot.leaving       { animation: fade-out .5s ease .45s forwards; }
  #boot.leaving .title { animation: title-out .4s ease-in forwards; }
  #boot.leaving .sun   { animation: sun-set .7s ease-in forwards; }
  #boot.leaving .ridge { animation: ridge-sink .6s ease-in forwards; }
  #boot.leaving .r2 { animation-delay: .08s; } #boot.leaving .r1 { animation-delay: .16s; }
  @keyframes title-out  { to { opacity: 0; transform: translateY(-12px); } }
  @keyframes sun-set    { to { transform: translateY(70px); } }
  @keyframes ridge-sink { to { transform: translateY(50px); } }
  @keyframes fade-out   { to { opacity: 0; } }

  @media (prefers-reduced-motion: reduce) {
    #boot *, #boot.leaving * { animation: none !important; }
    #boot.leaving { animation-delay: 0s; }
  }
</style>
</head>
<body>

<div id="boot" role="status" aria-label="Loading">
  <svg viewBox="0 0 320 200" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
    <circle class="sun" cx="160" cy="112" r="26" fill="#ffd27a"/>
    <path class="ridge r1" d="M0 130 L60 110 L100 125 L150 100 L210 120 L260 105 L320 125 V200 H0Z" fill="#d98a5b"/>
    <path class="ridge r2" d="M0 150 L50 140 L80 160 L130 145 L190 165 L240 140 L320 155 V200 H0Z" fill="#b5532f"/>
    <path class="ridge r3" d="M0 175 L70 165 L120 185 L200 170 L260 182 L320 172 V200 H0Z" fill="#7a2e1a"/>
  </svg>
  <h1 class="title">CANYON</h1>
</div>

<script>
  // bootLoader.dismiss() → Promise that resolves once the overlay is gone.
  // Called before the name has appeared, it lets the intro finish first.
  window.bootLoader = (() => {
    const el = document.getElementById('boot');
    const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const introDone = reduced ? Promise.resolve()
      : new Promise(r => el.querySelector('.title').addEventListener('animationend', r, { once: true }));
    let gone;
    return {
      dismiss() {
        return gone ??= introDone.then(() => new Promise(resolve => {
          el.classList.add('leaving');
          el.addEventListener('animationend', e => {
            if (e.target !== el) return;
            el.remove();
            resolve();
          });
        }));
      }
    };
  })();

  // demo only: click to dismiss. In the app, call bootLoader.dismiss() when ready.
  document.getElementById('boot').addEventListener('click', () => bootLoader.dismiss());
</script>

<main style="padding: 40px 16px; text-align: center;">
  <h2>App is ready</h2>
  <p><a href="">Replay</a></p>
</main>
</body>
</html>
