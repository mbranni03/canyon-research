<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boot Loader Options</title>
<style>
  :root { --navy: #004879; --red: #d03027; --sand: #fff7ec; }
  body { margin: 0; padding: 24px 16px; background: #f4efe8; font-family: system-ui, sans-serif; color: #1d2733; }
  h1 { margin: 0 0 20px; font-size: 1.4rem; }
  .grid { display: grid; gap: 20px; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
  figure { margin: 0; background: #fff; border-radius: 14px; overflow: hidden; box-shadow: 0 1px 3px #0002; }
  figure svg { display: block; width: 100%; height: auto; }
  figcaption { padding: 12px 14px; font-size: .9rem; }
  figcaption b { display: block; margin-bottom: 2px; }

  /* Every loader loops here for preview. For a real boot screen, swap `infinite`
     for `1 forwards` and fade the overlay out when the app is ready. */
  svg * { transform-box: fill-box; }

  /* A: Canyon Sunrise */
  .a .sun   { animation: sun 4s ease-out infinite; }
  .a .ridge { animation: rise 4s cubic-bezier(.2,.8,.3,1) infinite; }
  .a .r2 { animation-delay: .15s; } .a .r3 { animation-delay: .3s; }
  .a .title { animation: fade 4s ease infinite .6s; }
  @keyframes sun  { 0% { transform: translateY(70px); } 40%, 88% { transform: none; } 100% { transform: translateY(70px); } }
  @keyframes rise { 0% { transform: translateY(50px); } 30%, 88% { transform: none; } 100% { transform: translateY(50px); } }
  @keyframes fade { 0%, 10% { opacity: 0; transform: translateY(6px); } 35%, 80% { opacity: 1; transform: none; } 95%, 100% { opacity: 0; } }

  /* B: Bridge Builder */
  .b .plank { animation: drop 4s cubic-bezier(.3,1.5,.6,1) infinite; animation-delay: calc(var(--i) * .15s); }
  .b .walker { animation: cross 4s ease-in-out infinite; }
  @keyframes drop  { 0% { transform: translateY(-30px); opacity: 0; } 10%, 85% { transform: none; opacity: 1; } 100% { opacity: 0; } }
  @keyframes cross { 0%, 35% { transform: none; opacity: 1; } 75%, 88% { transform: translateX(180px); opacity: 1; } 100% { transform: translateX(180px); opacity: 0; } }

  /* C: Swoosh */
  .c .arc   { stroke-dasharray: 1; animation: draw 3.5s cubic-bezier(.6,0,.2,1) infinite; }
  .c .title { animation: track 3.5s ease-out infinite; }
  @keyframes draw  { 0% { stroke-dashoffset: 1; } 45%, 88% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 0; opacity: 0; } }
  @keyframes track { 0%, 25% { opacity: 0; letter-spacing: 14px; } 60%, 88% { opacity: 1; letter-spacing: 2px; } 100% { opacity: 0; letter-spacing: 2px; } }

  /* D: Strata */
  .d .bar  { transform-origin: left; animation: layer 3.2s cubic-bezier(.5,0,.2,1) infinite; animation-delay: calc(var(--i) * .18s); }
  .d .word { animation: pulse 1.6s ease-in-out infinite; }
  @keyframes layer { 0% { transform: scaleX(0); } 30%, 85% { transform: none; } 100% { transform: scaleX(0); transform-origin: right; } }
  @keyframes pulse { 50% { opacity: .4; } }

  @media (prefers-reduced-motion: reduce) { svg * { animation: none !important; } }
</style>
</head>
<body>
<h1>Boot loader options</h1>
<div class="grid">

  <figure class="a">
    <svg viewBox="0 0 320 200" role="img" aria-label="Loading">
      <defs>
        <linearGradient id="dusk" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#0b2a4a"/><stop offset=".75" stop-color="#f2a65a"/>
        </linearGradient>
      </defs>
      <rect width="320" height="200" fill="url(#dusk)"/>
      <circle class="sun" cx="160" cy="112" r="26" fill="#ffd27a"/>
      <path class="ridge r1" d="M0 130 L60 110 L100 125 L150 100 L210 120 L260 105 L320 125 V200 H0Z" fill="#d98a5b"/>
      <path class="ridge r2" d="M0 150 L50 140 L80 160 L130 145 L190 165 L240 140 L320 155 V200 H0Z" fill="#b5532f"/>
      <path class="ridge r3" d="M0 175 L70 165 L120 185 L200 170 L260 182 L320 172 V200 H0Z" fill="#7a2e1a"/>
      <text class="title" x="160" y="58" text-anchor="middle" fill="#fff" font-size="26" font-weight="700" letter-spacing="4">CANYON</text>
    </svg>
    <figcaption><b>A · Canyon Sunrise</b>Ridges rise in layers as the sun comes up, then the name fades in.</figcaption>
  </figure>

  <figure class="b">
    <svg viewBox="0 0 320 200" role="img" aria-label="Loading">
      <rect width="320" height="200" fill="#004879"/>
      <path d="M0 120 H90 L102 200 H0Z" fill="#b5532f"/>
      <path d="M320 120 H230 L218 200 H320Z" fill="#b5532f"/>
      <g fill="#d03027">
        <rect class="plank" style="--i:0" x="91"  y="116" width="18" height="6" rx="1.5"/>
        <rect class="plank" style="--i:1" x="111" y="116" width="18" height="6" rx="1.5"/>
        <rect class="plank" style="--i:2" x="131" y="116" width="18" height="6" rx="1.5"/>
        <rect class="plank" style="--i:3" x="151" y="116" width="18" height="6" rx="1.5"/>
        <rect class="plank" style="--i:4" x="171" y="116" width="18" height="6" rx="1.5"/>
        <rect class="plank" style="--i:5" x="191" y="116" width="18" height="6" rx="1.5"/>
        <rect class="plank" style="--i:6" x="211" y="116" width="18" height="6" rx="1.5"/>
      </g>
      <circle class="walker" cx="60" cy="109" r="7" fill="#fff"/>
      <text x="160" y="172" text-anchor="middle" fill="#fff" opacity=".8" font-size="13">Building your bridge…</text>
    </svg>
    <figcaption><b>B · Bridge Builder</b>Planks drop in across the gap (a progress bar in disguise), then a dot crosses.</figcaption>
  </figure>

  <figure class="c">
    <svg viewBox="0 0 320 200" role="img" aria-label="Loading">
      <rect width="320" height="200" fill="#013d5b"/>
      <path class="arc" pathLength="1" d="M66 98 Q170 26 262 72" fill="none" stroke="#d03027" stroke-width="9" stroke-linecap="round"/>
      <text class="title" x="160" y="132" text-anchor="middle" fill="#fff" font-size="32" font-weight="700" letter-spacing="2">Canyon</text>
    </svg>
    <figcaption><b>C · Swoosh</b>A red arc draws over the navy field while the wordmark tightens into place.</figcaption>
  </figure>

  <figure class="d">
    <svg viewBox="0 0 320 200" role="img" aria-label="Loading">
      <rect width="320" height="200" fill="#fff7ec"/>
      <!-- bottom layer lands first, like sediment -->
      <rect class="bar" style="--i:4" x="80" y="56"  width="160" height="12" rx="6" fill="#f2c48d"/>
      <rect class="bar" style="--i:3" x="80" y="72"  width="160" height="12" rx="6" fill="#e09a5f"/>
      <rect class="bar" style="--i:2" x="80" y="88"  width="160" height="12" rx="6" fill="#c96a3c"/>
      <rect class="bar" style="--i:1" x="80" y="104" width="160" height="12" rx="6" fill="#a8472a"/>
      <rect class="bar" style="--i:0" x="80" y="120" width="160" height="12" rx="6" fill="#7a2e1a"/>
      <text class="word" x="160" y="162" text-anchor="middle" fill="#004879" font-size="14" font-weight="600" letter-spacing="1">Loading</text>
    </svg>
    <figcaption><b>D · Strata</b>Rock layers stack up from the bottom. The quietest option, and it works at small sizes.</figcaption>
  </figure>

</div>
</body>
</html>
